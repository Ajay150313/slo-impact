  <rect x="40" y="48" width="720" height="56" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/><text x="400.0" y="70" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600">Incident  ·  duration × user_fraction × traffic_weight</text><text x="400.0" y="88" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">3 AM / 5% users ≠ noon / all users</text>
