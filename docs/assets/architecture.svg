<rect x="420" y="128" width="340" height="72" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/><text x="590.0" y="150" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600">User-impact uptime</text><text x="590.0" y="168" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">1 − Σ impact_seconds / window</text>
